<style>
  :root{
    --ink: #0F1729;
    --panel: #161F38;
    --panel-light: #1E2A47;
    --brass: #D7A24C;
    --paper: #F2EEE3;
    --slate: #8993A8;
    --rule: rgba(242,238,227,0.10);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    min-height: 100vh;
    background: radial-gradient(120% 140% at 15% -10%, #1A2747 0%, var(--ink) 55%, #0A1020 100%);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    display:block;
  }
  h1{
    font-size: 22px;
    font-weight: 600;
    margin: 6px 0 4px;
  }
  .subtitle{ font-size: 13px; color: var(--slate); margin-bottom: 20px; }
  .back-link{
    display:inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--slate);
    text-decoration:none;
    margin-bottom: 18px;
    border: 1px solid var(--rule);
    padding: 6px 12px;
    border-radius: 8px;
  }
  .back-link:hover{ color: var(--paper); border-color: var(--brass); }
  .actions{ display:flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--brass);
    color: var(--ink);
    font-weight: 600;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  button:hover:not(:disabled){ background: #E5B563; }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  button.secondary{
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--rule);
  }
  button.secondary:hover:not(:disabled){ border-color: var(--brass); color: var(--brass); }
  .status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--slate);
    margin-bottom: 16px;
    min-height: 18px;
  }
  .panel{
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    overflow: hidden;
  }
  table{ width: 100%; border-collapse: collapse; }
  thead th{
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    padding: 12px 16px;
    border-bottom: 1px solid var(--rule);
  }
  tbody td{
    padding: 10px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--rule);
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody tr:hover{ background: var(--panel-light); }
  td.rank{ font-family: 'IBM Plex Mono', monospace; color: var(--slate); width: 40px; }
  td.temp{ font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--brass); text-align:right; }
  .empty-hint{ padding: 40px 16px; text-align:center; color: var(--slate); font-size: 13px; }
  footer{
    max-width: 720px;
    margin: 24px auto 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--slate);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/">← Volver al clima</a>
  <span class="eyebrow">SONORA — 72 MUNICIPIOS</span>
  <h1>Temperatura máxima del día por municipio</h1>
  <p class="subtitle">Ordenado de mayor a menor. Genera la lista del día y descárgala en PDF.</p>

  <div class="actions">
    <button id="generarBtn" type="button">Generar lista</button>
    <button id="pdfBtn" type="button" class="secondary" disabled>Descargar PDF</button>
  </div>

  <div id="status" class="status"></div>

  <div class="panel">
    <table id="tabla" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Municipio</th>
          <th>Cabecera</th>
          <th style="text-align:right;">Máx. °C</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyHint" class="empty-hint">Presiona "Generar lista" para consultar los 72 municipios.</div>
  </div>

  <footer>DATOS: WEATHERAPI.COM</footer>
</div>

<script>
  let ultimaLista = null;
  let ultimaFecha = null;

  const generarBtn = document.getElementById('generarBtn');
  const pdfBtn = document.getElementById('pdfBtn');
  const statusEl = document.getElementById('status');
  const tabla = document.getElementById('tabla');
  const tbody = document.getElementById('tbody');
  const emptyHint = document.getElementById('emptyHint');

  async function generarLista(){
    generarBtn.disabled = true;
    pdfBtn.disabled = true;
    statusEl.textContent = 'Consultando los 72 municipios, un momento…';
    tabla.style.display = 'none';
    emptyHint.style.display = 'block';
    emptyHint.textContent = 'Cargando…';

    try{
      const res = await fetch('/api/municipios-temp');
      const data = await res.json();
      if(!res.ok) throw new Error(data?.error?.message || 'Error al consultar el clima.');

      ultimaLista = data.municipios;
      ultimaFecha = new Date(data.generado);

      tbody.innerHTML = '';
      ultimaLista.forEach((m, i) => {
        const tr = document.createElement('tr');
        const temp = (m.maxtemp_c === null || m.maxtemp_c === undefined) ? '—' : m.maxtemp_c.toFixed(1);
        tr.innerHTML = `
          <td class="rank">${i+1}</td>
          <td>${m.municipio}</td>
          <td>${m.cabecera}</td>
          <td class="temp">${temp}</td>
        `;
        tbody.appendChild(tr);
      });

      tabla.style.display = 'table';
      emptyHint.style.display = 'none';
      const fechaTexto = ultimaFecha.toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' });
      statusEl.textContent = `Lista generada · ${fechaTexto}`;
      pdfBtn.disabled = false;
    }catch(err){
      statusEl.textContent = 'No se pudo generar la lista: ' + err.message;
      emptyHint.textContent = 'Intenta de nuevo.';
    }finally{
      generarBtn.disabled = false;
    }
  }

  function descargarPDF(){
    if(!ultimaLista) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const fechaTexto = ultimaFecha.toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' });
    doc.setFontSize(14);
    doc.text('Temperatura máxima por municipio — Sonora', 14, 16);
    doc.setFontSize(10);
    doc.text('Generado: ' + fechaTexto, 14, 23);

    const filas = ultimaLista.map((m, i) => [
      i+1,
      m.municipio,
      m.cabecera,
      (m.maxtemp_c === null || m.maxtemp_c === undefined) ? '—' : m.maxtemp_c.toFixed(1) + ' °C'
    ]);

    doc.autoTable({
      startY: 28,
      head: [['#', 'Municipio', 'Cabecera', 'Máx.']],
      body: filas,
      styles: { fontSize: 9 },
      headStyles: { fillColor: [22, 31, 56] },
      columnStyles: { 0: { cellWidth: 12 }, 3: { halign: 'right', cellWidth: 22 } }
    });

    const fechaArchivo = ultimaFecha.toISOString().slice(0,10);
    doc.save(`temperaturas-sonora-${fechaArchivo}.pdf`);
  }

  generarBtn.addEventListener('click', generarLista);
  pdfBtn.addEventListener('click', descargarPDF);
</script>
</body>
</html>
